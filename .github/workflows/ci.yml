name: ci
on:
  push:
    branches: [main]
  pull_request:

# Read-only token for every job; a job that needs more asks for it itself.
# Third-party actions are pinned to a full commit SHA (a tag can be moved to
# new code); the comment names the version the SHA was taken from.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # pytest/httpx are test-only deps (FastAPI TestClient transport); pillow
      # is for scripts/prep-season-photo.py's tests (the app never imports it).
      # requirements.lock pins the app's packages to what the image ships.
      - run: pip install -r requirements.txt -c requirements.lock pytest httpx pillow
      # Includes the JS suite: tests/test_js.py runs node --test (and fails,
      # not skips, when CI has no node), so there is no separate node step.
      - run: python -m pytest tests -q
        env:
          PYTHONPATH: src

  gitleaks:
    runs-on: ubuntu-latest
    # On a pull request the action lists the PR's commits through the API,
    # which needs pull-requests: read on top of the workflow's contents: read.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # full history — the sweep covers every commit
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  changelog-guard:
    # A PR that changes app code under src/ must add a CHANGELOG [Unreleased]
    # entry (docs-only / test-only diffs are exempt). Same check as the local
    # .githooks/pre-commit hook.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # need the PR base commit reachable for the diff
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_changelog.py --base "$BASE_SHA"
