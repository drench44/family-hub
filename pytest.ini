[pytest]
filterwarnings =
    # Pre-existing dependency deprecation (starlette TestClient warns that its
    # bundled httpx transport will require the separate httpx2 package in a
    # future release) — unrelated to this branch, and not our code to fix.
    # Scoped to the exact message; the category is the builtin UserWarning
    # (StarletteDeprecationWarning's base) rather than the starlette class,
    # because naming a class that only exists in starlette >= 1.x makes
    # pytest ERROR at config parse under older installs (bit the deploy
    # box's system python, starlette 0.52). The exact-message match keeps
    # the filter effectively as narrow; genuine DeprecationWarnings still
    # surface.
    ignore:Using `httpx` with `starlette\.testclient` is deprecated; install `httpx2` instead\.\Z:UserWarning
