<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Family Hub</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=46">
  <!-- Stamps data-theme/data-accent/data-cols on <html> before first paint
       (no theme flash). Must be the FIRST script in the document. -->
  <script src="theme.js?v=3"></script>
</head>
<body class="wall" data-conn="up" data-tab="chores">
  <div class="wrap">
    <header class="topbar">
      <span class="breath-dot"></span>
      <span class="wordmark">Family Hub</span>
      <span class="conn" id="conn-word">live</span>
      <span class="spacer"></span>
      <span class="clock"><span class="clock-date" id="clock-date"></span><span class="num" id="clock-time"></span></span>
      <!-- Display gear: re-theme the wall touchscreen without a phone. Opens the
           popover below; the SAME three controls the admin page carries. -->
      <button class="wall-gear" id="wall-gear" type="button" aria-label="Display settings" aria-haspopup="dialog" aria-expanded="false">⚙</button>
      <div class="theme-pop" id="theme-pop" role="dialog" aria-label="Display settings">
        <div class="theme-ctl">
          <div class="theme-pop-row">
            <span class="theme-pop-k">Theme</span>
            <div class="seg" role="group" aria-label="Theme">
              <button type="button" data-theme-set="light">Light</button>
              <button type="button" data-theme-set="dark">Dark</button>
            </div>
          </div>
          <div class="theme-pop-row">
            <span class="theme-pop-k">Accent</span>
            <div class="swatches" role="group" aria-label="Accent color">
              <button class="swatch" type="button" data-c="cyan"   aria-label="Cyan accent"></button>
              <button class="swatch" type="button" data-c="violet" aria-label="Violet accent"></button>
              <button class="swatch" type="button" data-c="amber"  aria-label="Amber accent"></button>
              <button class="swatch" type="button" data-c="green"  aria-label="Green accent"></button>
            </div>
          </div>
          <div class="theme-pop-row">
            <span class="theme-pop-k">Columns</span>
            <div class="seg" role="group" aria-label="Column separation">
              <button type="button" data-cols-set="none">None</button>
              <button type="button" data-cols-set="wells">Wells</button>
              <button type="button" data-cols-set="lines">Lines</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="hub-grid">
      <section class="cal" id="cal" aria-label="Calendar"></section>
      <section class="todo-slot" id="todo-slot" aria-label="To-dos"></section>
      <section class="people-col" aria-label="Chores">
        <!-- The Chores header + "⛶ All chores" expand button are injected by
             hub.js renderPeople (a .shead section header, the one system every
             section uses), so chores reads as an expandable section. -->
        <div id="people" class="people-list"></div>
      </section>
      <div class="tiles" id="tiles"></div>
      <!-- Always-on live dashboard embeds, built by hub.js from the panels
           list in /api/hub links (config-driven since 2026-08-13). -->
      <section class="panels" id="panels" aria-label="Dashboards"></section>
      <!-- Phone To-Dos tab content (hidden on the wall; the wall reaches the
           same view through the To-Do card's full-screen overlay). -->
      <section class="todos-page" id="todos-page" aria-label="To-dos"></section>
    </div>
  </div>

  <!-- Phone/tablet bottom tabs (hidden on the wall by CSS): each big surface
       gets its own tab (operator request 2026-08-13). -->
  <nav class="tabbar" id="tabbar" aria-label="Sections">
    <button class="tab-btn active" type="button" data-tab="chores"><span class="tab-ico">🧹</span>Chores</button>
    <button class="tab-btn" type="button" data-tab="todos"><span class="tab-ico">✅</span>To-Dos</button>
    <button class="tab-btn" type="button" data-tab="cal"><span class="tab-ico">📅</span>Calendar</button>
    <button class="tab-btn" type="button" data-tab="cams"><span class="tab-ico">📷</span>Cameras</button>
    <button class="tab-btn" type="button" data-tab="weather"><span class="tab-ico">🌤️</span>Weather</button>
  </nav>

  <!-- Full-screen overlays. Iframe URLs are injected from /api/hub at runtime. -->
  <div class="overlay" id="overlay">
    <button class="overlay-home" id="overlay-home" type="button">⌂ home</button>
    <div class="overlay-content" id="overlay-content"></div>
  </div>

  <!-- Event detail card (filled by hub.js; sits above everything) -->
  <div class="ev-modal hidden" id="ev-modal"><div class="ev-card" id="ev-card"></div></div>

  <!-- Chore add/edit editor: the shared chore form, opened from the all-chores
       overlay's edit mode. Layered above #overlay (like #ev-modal) so it floats
       over the chores view; dismissed by the ✕ or a backdrop tap. -->
  <div class="chore-modal hidden" id="chore-modal">
    <div class="chore-card" id="chore-card">
      <button class="chore-close" type="button" aria-label="Close">✕</button>
      <div id="chore-editor"></div>
    </div>
  </div>

  <!-- Delete confirm: a CUSTOM confirm (window.confirm is blocked on kiosks and
       against policy). Layered above the overlay like the editor; it names the
       chore. Cancel dismisses with no write; Delete fires DELETE /api/admin/
       chores/{id}. Filled + toggled by hub.js. -->
  <div class="confirm-modal hidden" id="confirm-modal">
    <div class="confirm-card" id="confirm-card">
      <div class="confirm-msg" id="confirm-msg"></div>
      <div class="confirm-actions">
        <button class="confirm-cancel" type="button" data-confirm-cancel="1">Cancel</button>
        <button class="confirm-del" type="button" data-confirm-del="1">Delete</button>
      </div>
    </div>
  </div>

  <script src="common.js?v=32"></script>
  <script src="hub.js?v=48"></script>
</body>
</html>
