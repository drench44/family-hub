# Exact versions of every runtime package, direct and transitive, used as a
# pip constraints file: `pip install -r requirements.txt -c requirements.lock`.
# requirements.txt stays the short list of what the app imports; this file
# pins what those pull in, so an image rebuild or a CI run installs the same
# set the running hub was tested with instead of whatever is newest that day.
# Taken from `pip freeze` in the production image (python:3.12-slim).
# To update: bump requirements.txt if needed, install into a clean 3.12 venv
# with `pip install -r requirements.txt`, then paste `pip freeze` below.
