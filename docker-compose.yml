# Every container caps its json log at 5 x 10 MB. Uncapped, docker keeps a
# container's log forever: the hub alone wrote ~19 MB a day.
x-logging: &capped-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  web:
    build: { context: ., dockerfile: web.Dockerfile }
    image: family-hub:1.0
    container_name: family-hub
    # your Linux user's uid:gid — must own ./data (id -u; id -g)
    user: "${HUB_UID:-1000}:${HUB_GID:-1000}"
    restart: unless-stopped
    # memswap_limit = mem_limit on every service: no swap. A container at its
    # limit should be killed and restarted in seconds, not swap for minutes
    # first (go2rtc did, 2026-09-22, and the wall's cameras hung meanwhile).
    mem_limit: 256m
    memswap_limit: 256m
    logging: *capped-logs
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      # Where the hub reaches go2rtc: over the compose network. Browsers never
      # talk to go2rtc directly; the hub proxies the player at /go2rtc/.
      - GO2RTC_FETCH_BASE=http://go2rtc:1984
      # iCloud CalDAV bot credentials (optional; see .env). Empty = off.
      - ICLOUD_CALDAV_USER=${ICLOUD_CALDAV_USER:-}
      - ICLOUD_CALDAV_APP_PASSWORD=${ICLOUD_CALDAV_APP_PASSWORD:-}
      # Home Assistant long-lived token for the laundry card (optional; see
      # .env). Empty = laundry off. This allowlist is the only way env vars
      # reach the container — a var missing here is invisible inside.
      - HA_TOKEN=${HA_TOKEN:-}
    # HUB_BIND (in .env) pins every published port to one LAN interface.
    # The hub has NO auth — never expose it beyond your LAN. See README.
    ports: [ "${HUB_BIND:-0.0.0.0}:8138:8138" ]
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/data
  wyze-bridge:
    # OPTIONAL — only needed for Wyze cameras (no native RTSP): bridges them
    # onto the compose network; go2rtc consumes
    # rtsp://wyze-bridge:8554/<camera-name-slug>. Credentials live in the
    # box-only data/wyze.env (email, password, API key — never in git).
    # Remove this service if you have no Wyze cams.
    #
    # We use the IDisposable fork, not the original mrlt8/wyze-bridge: Wyze
    # Cam v4 firmware 4.52.9 (2025) disabled the TUTK P2P protocol the
    # original relied on (streams fail with IOTC_ER_TIMEOUT), and the
    # original is no longer maintained. This fork auto-falls-back to Wyze's
    # WebRTC backend, which still works. If you have v3/v4 cams on recent
    # firmware, this is the image that works. MODEL_OVERRIDES pins v4s
    # straight to WebRTC (skips a 5-failure TUTK wait); drop it if all your
    # cams are older models that still speak TUTK.
    # NOTE: this fork slugs stream names with UNDERSCORES
    # (my_cam_name_), where the original used dashes — match your
    # go2rtc.yaml stream URLs accordingly (check the WebUI on :5050).
    # Pinned (was :latest) so a re-pull can't silently change behavior; bump
    # deliberately. Consider digest-pinning (@sha256:...) for full immutability.
    image: idisposablegithub365/wyze-bridge:4.5.0
    container_name: family-hub-wyze-bridge
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    logging: *capped-logs
    # The image has busybox wget (no curl). /api/health answers
    # {"status":"ok",...} once the WebUI is up.
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "4", "-O", "/dev/null", "http://127.0.0.1:5080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - WB_AUTH=False          # LAN-only WebUI, same trust model as the hub
      # AUDIO POLICY: no camera on the hub ever carries a microphone track.
      # (Also enforced per-stream in go2rtc.yaml via #media=video.)
      - ENABLE_AUDIO=False
      - MODEL_OVERRIDES=HL_CAM4:is_webrtc=true
    # required:false so a fresh clone composes cleanly before Wyze is set up
    env_file:
      - path: ./data/wyze.env
        required: false
    # The WebUI (setup/debug; this fork serves it on 5080) has no auth and
    # shows every camera, so it is published on the box's loopback only.
    # From another machine: ssh -L 5050:127.0.0.1:5050 <box>, then open
    # http://127.0.0.1:5050/ there.
    ports:
      - "127.0.0.1:5050:5080"
    # The image declares /config and /media volumes. Named, so a recreate or a
    # `down` does not leave another anonymous volume behind each time;
    # /config also keeps the bridge's Wyze login state across recreates.
    volumes:
      - wyze-bridge-config:/config
      - wyze-bridge-media:/media
  go2rtc:
    # OPTIONAL — only needed for camera tiles. Pin the digest after your
    # first pull (docker compose pull go2rtc; record the sha256 here).
    # 1.9.14 is the newest release (checked 2026-09-23).
    image: alexxit/go2rtc:1.9.14
    container_name: family-hub-go2rtc
    restart: unless-stopped
    # Memory, from the OOM kills on a real box: 128m died five times, then
    # 256m (with 256m of swap on top) died too, on 2026-09-22 with BOTH full:
    # go2rtc itself held ~170 MB resident plus ~250 MB swapped, with ffmpeg
    # children beside it. So this stack has needed ~512 MB at a peak, and
    # 768m is that plus half again. No swap (memswap_limit = mem_limit): a
    # runaway is killed and restarted in seconds instead of thrashing.
    # GOMEMLIMIT makes go2rtc's Go garbage collector work harder as its heap
    # nears 512 MiB (by default Go lets the heap reach twice its live size),
    # leaving the rest for the ffmpeg go2rtc starts for each snapshot.
    mem_limit: 768m
    memswap_limit: 768m
    logging: *capped-logs
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - GOMEMLIMIT=512MiB
    # The image has curl. /api is go2rtc's cheapest answer (its version info).
    # Like wyze-bridge's, this check only REPORTS: docker's restart policy
    # ignores health, so an unhealthy container keeps running until a watcher
    # (a deploy gate, a monitor reading .State.Health) acts on it. It proves
    # the process answers, not that any camera streams; /health/full on the
    # hub checks go2rtc knows every configured stream.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "--max-time", "4", "http://127.0.0.1:1984/api"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # go2rtc's API (1984) has NO access control: /api/streams and /api/config
    # hand out every camera URL (often a password or token) and let anyone
    # rewrite the config. Browsers reach only the player, through the hub's
    # /go2rtc/ proxy; the hub reaches go2rtc over the compose network. 1984 is
    # published on the box's loopback only, for debugging over ssh
    # (ssh -L 1984:127.0.0.1:1984 <box>, then http://127.0.0.1:1984/).
    # 8555 is WebRTC media, which browsers do connect to directly; it carries
    # no API.
    ports:
      - "127.0.0.1:1984:1984"
      - "${HUB_BIND:-0.0.0.0}:8555:8555/tcp"
      - "${HUB_BIND:-0.0.0.0}:8555:8555/udp"
    volumes:
      # Read-only: nothing may rewrite the config through the API (a stream
      # added there could run a command). Edit data/go2rtc.yaml on the box
      # and `docker compose restart go2rtc`.
      - ./data/go2rtc.yaml:/config/go2rtc.yaml:ro
      # The image declares a /config volume. Named, so a recreate or a `down`
      # does not leave another anonymous volume behind each time.
      - go2rtc-config:/config

volumes:
  go2rtc-config:
  wyze-bridge-config:
  wyze-bridge-media:
